<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build.Connect</title>
    <meta
      name="description"
      content="Build.Connect - Hub de documentos e vídeos de integração por setor."
    />

    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://unpkg.com https://www.youtube.com https://s.ytimg.com;
      style-src 'self';
      img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com https://i.ytimg.com;
      frame-src https://script.google.com https://*.googleusercontent.com https://docs.google.com https://drive.google.com https://www.youtube.com https://www.youtube-nocookie.com;
      connect-src 'self' https://*.supabase.co https://www.googleapis.com;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://script.google.com;
      upgrade-insecure-requests;
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="auth-root"></div>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" aria-label="Navegação lateral principal">
        <div id="sidebar-root"></div>
      </aside>

      <main class="content" id="content" tabindex="-1" aria-live="polite"></main>
    </div>

    <script src="https://unpkg.com/lucide@1.7.0/dist/umd/lucide.min.js" defer></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
