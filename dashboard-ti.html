<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build.Connect · Dashboard TI</title>
  <script src="https://unpkg.com/lucide@1.7.0/dist/umd/lucide.min.js" defer></script>
  <style>
    :root {
      --bg:       #050A1A;
      --surface:  #0E1528;
      --card:     #121B30;
      --border:   #1C263D;
      --text:     #FFFFFF;
      --muted:    #8E9AAF;
      --primary:  #D4A257;
      --green:    #10B981;
      --blue:     #3B82F6;
      --purple:   #8B5CF6;
      --yellow:   #F59E0B;
      --red:      #EF4444;
      --radius:   10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Calibri', 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 20px 24px;
    }

    /* ── Header ── */
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .dash-brand { display: flex; align-items: center; gap: 10px; }
    .dash-brand-name { font-size: 1.15rem; font-weight: 700; }
    .dash-brand-name span { color: var(--primary); }
    .dash-subtitle { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .dash-status {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .dash-clock {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: right;
    }

    .dash-clock strong { display: block; font-size: 1.1rem; color: var(--text); font-weight: 600; }

    .dash-refresh-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: var(--surface);
    }

    .dash-refresh-info i { width: 14px; height: 14px; }
    .dash-refresh-info.is-refreshing { color: var(--primary); border-color: var(--primary); }

    /* ── KPI Grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
    }

    .kpi-icon {
      width: 46px; height: 46px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .kpi-icon i { width: 22px; height: 22px; }

    .kpi-total   .kpi-icon { background: rgba(142,154,175,0.12); color: var(--muted); }
    .kpi-pending .kpi-icon { background: rgba(245,158,11,0.15);  color: var(--yellow); }
    .kpi-assigned .kpi-icon { background: rgba(139,92,246,0.15); color: var(--purple); }
    .kpi-progress .kpi-icon { background: rgba(59,130,246,0.15); color: var(--blue);   }
    .kpi-done    .kpi-icon { background: rgba(16,185,129,0.15);  color: var(--green);  }

    .kpi-pending  { border-color: rgba(245,158,11,0.3); }
    .kpi-assigned { border-color: rgba(139,92,246,0.3); }
    .kpi-progress { border-color: rgba(59,130,246,0.3); }
    .kpi-done     { border-color: rgba(16,185,129,0.3); }

    .kpi-body { display: flex; flex-direction: column; gap: 2px; }
    .kpi-value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .kpi-label { font-size: 0.75rem; color: var(--muted); }
    .kpi-pct   { font-size: 0.7rem; color: var(--muted); }

    /* ── Metrics Row ── */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .metric-card i { width: 20px; height: 20px; color: var(--primary); flex-shrink: 0; }
    .metric-value { font-size: 1.05rem; font-weight: 700; display: block; }
    .metric-label { font-size: 0.72rem; color: var(--muted); display: block; }

    /* ── Charts + Distribution ── */
    .charts-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr) 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .chart-card, .dist-card {
      padding: 16px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
    }

    .chart-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .chart-head i { width: 15px; height: 15px; }

    .color-bars { display: flex; flex-direction: column; gap: 9px; }

    .color-bar-row {
      display: grid;
      grid-template-columns: 10px 1fr auto auto;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .bar-label {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      height: 7px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
    }

    .bar-fill { height: 100%; border-radius: 4px; transition: width 600ms ease; }

    .bar-meta { font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .bar-meta small { color: var(--muted); font-weight: 400; font-size: 0.72rem; }

    .chart-empty { font-size: 0.82rem; color: var(--muted); text-align: center; padding: 20px 0; }

    /* Status distribution */
    .dist-bar {
      display: flex;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin: 12px 0 10px;
      gap: 2px;
    }

    .dist-seg { height: 100%; min-width: 4px; transition: width 600ms ease; }

    .dist-legend { display: flex; flex-direction: column; gap: 8px; }

    .dist-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .dist-legend-item strong { color: var(--text); font-weight: 600; margin-left: auto; }

    /* ── Table ── */
    .table-section {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .table-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .table-title i { width: 15px; height: 15px; }

    .table-count {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--border);
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      padding: 9px 14px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 14px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .td-id { font-family: monospace; font-size: 0.75rem; color: var(--muted); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
    }

    .s-pending  { background: rgba(245,158,11,0.12); color: var(--yellow); }
    .s-assigned { background: rgba(139,92,246,0.12); color: var(--purple); }
    .s-progress { background: rgba(59,130,246,0.12);  color: var(--blue); }
    .s-done     { background: rgba(16,185,129,0.12);  color: var(--green); }

    /* ── Loading / Error ── */
    .dash-loading, .dash-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .dash-loading i, .dash-error i { width: 40px; height: 40px; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress bar (refresh countdown) ── */
    .refresh-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: var(--primary);
      transition: width linear;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="root">
  <div class="dash-loading">
    <i data-lucide="loader-circle" class="spin"></i>
    <span>Carregando dashboard…</span>
  </div>
</div>

<div class="refresh-bar" id="refresh-bar" style="width:100%"></div>

<script>
  const API_URL = 'https://mrdrfcclfbncwqyehknx.supabase.co/functions/v1/bc-api';
  const API_KEY = 'sb_publishable_qOJLHHri-wmnwqku9EpQlg_31Aq_PI5';
  const REFRESH_MS = 5 * 60 * 1000; // 5 minutos

  const COLORS_CAT  = ['3B82F6','8B5CF6','10B981','F59E0B','EF4444','6366F1','14B8A6'];
  const COLORS_UNIT = ['D4A257','10B981','3B82F6','8B5CF6','F59E0B','EF4444','6366F1'];
  const COLORS_USER = ['10B981','3B82F6','8B5CF6','D4A257','F59E0B'];

  let refreshTimer = null;
  let barTimer = null;

  // ── Clock ──────────────────────────────────────────────────────────────
  function updateClock() {
    const el = document.getElementById('clock-value');
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateClock, 1000);

  // ── Refresh countdown bar ──────────────────────────────────────────────
  function startRefreshBar() {
    const bar = document.getElementById('refresh-bar');
    if (!bar) return;
    clearInterval(barTimer);
    const start = Date.now();
    bar.style.transition = 'none';
    bar.style.width = '100%';
    barTimer = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.max(0, 100 - (elapsed / REFRESH_MS) * 100);
      bar.style.transition = 'width 1s linear';
      bar.style.width = pct + '%';
      if (pct <= 0) clearInterval(barTimer);
    }, 1000);
  }

  function normalizeTicket(t) {
    if (!t) return t;
    return {
      id:                t.id,
      status:            t.status,
      timestamp:         t.timestamp,
      solicitanteNome:   t.solicitante_nome  ?? t.solicitanteNome  ?? '—',
      solicitanteSetor:  t.solicitante_setor ?? t.solicitanteSetor ?? '—',
      solicitanteId:     t.solicitante_id    ?? t.solicitanteId    ?? '',
      unidade:           t.unidade           ?? '—',
      categoria:         t.categoria         ?? '—',
      descricao:         t.descricao         ?? '',
      atribuidoParaNome: t.atribuido_para_nome ?? t.atribuidoParaNome ?? '',
      atribuidoParaId:   t.atribuido_para_id  ?? t.atribuidoParaId  ?? '',
      dataAtribuicao:    t.data_atribuicao    ?? t.dataAtribuicao   ?? null,
      dataInicio:        t.data_inicio        ?? t.dataInicio       ?? null,
      dataConclusao:     t.data_conclusao     ?? t.dataConclusao    ?? null,
      duracaoMinutos:    t.duracao_minutos    ?? t.duracaoMinutos   ?? null,
      observacao:        t.observacao         ?? '',
    };
  }

  // ── Fetch data ─────────────────────────────────────────────────────────
  async function fetchData() {
    setRefreshing(true);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
        body: JSON.stringify({ action: 'dashboard-ti-data', period: 'tudo' }),
      });
      const data = await res.json();
      if (data.success) {
        data.tickets          = (data.tickets          || []).map(normalizeTicket);
        data.completedTickets = (data.completedTickets || []).map(normalizeTicket);
        renderDashboard(data);
      } else {
        renderError(data.message || 'Erro ao carregar dados.');
      }
    } catch (e) {
      renderError('Falha de conexão. Tentando novamente em 5 minutos.');
    }
    setRefreshing(false);
    startRefreshBar();
    scheduleNext();
  }

  function scheduleNext() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(fetchData, REFRESH_MS);
  }

  function setRefreshing(on) {
    const el = document.getElementById('refresh-status');
    if (!el) return;
    el.className = 'dash-refresh-info' + (on ? ' is-refreshing' : '');
    el.innerHTML = on
      ? '<i data-lucide="refresh-cw"></i><span>Atualizando…</span>'
      : '<i data-lucide="clock-4"></i><span>Atualiza a cada 5 min</span>';
    if (window.lucide) lucide.createIcons();
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' }); }
    catch { return '—'; }
  }

  function fmtDuration(mins) {
    if (!mins || isNaN(mins)) return null;
    const m = parseInt(mins);
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60), r = m % 60;
    return r > 0 ? h + 'h ' + r + 'min' : h + 'h';
  }

  function countBy(arr, key) {
    const map = {};
    (arr || []).forEach(t => { const k = t[key] || 'Não informado'; map[k] = (map[k] || 0) + 1; });
    return Object.entries(map).map(([label, count]) => ({ label, count })).sort((a, b) => b.count - a.count);
  }

  function getTopAssignee(done) {
    const map = {};
    (done || []).forEach(t => { if (t.atribuidoParaNome) map[t.atribuidoParaNome] = (map[t.atribuidoParaNome] || 0) + 1; });
    const sorted = Object.entries(map).sort((a, b) => b[1] - a[1]);
    return sorted.length ? sorted[0][0].split(' ')[0] : '—';
  }

  function colorBars(data, colors) {
    if (!data.length) return '<p class="chart-empty">Sem dados disponíveis</p>';
    const max = Math.max(...data.map(d => d.count), 1);
    const total = data.reduce((s, d) => s + d.count, 0) || 1;
    return '<div class="color-bars">' + data.slice(0, 7).map((item, i) => {
      const c = colors[i % colors.length];
      const pct = Math.round((item.count / total) * 100);
      const bw = Math.round((item.count / max) * 100);
      return `<div class="color-bar-row">
        <span class="dot" style="background:#${c}"></span>
        <span class="bar-label" title="${esc(item.label)}">${esc(item.label)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${bw}%;background:#${c}"></div></div>
        <span class="bar-meta">${item.count} <small>(${pct}%)</small></span>
      </div>`;
    }).join('') + '</div>';
  }

  function statusBadge(status) {
    const map = {
      'Pendente':     ['s-pending',  'F59E0B'],
      'Atribuído':    ['s-assigned', '8B5CF6'],
      'Em andamento': ['s-progress', '3B82F6'],
      'Concluído':    ['s-done',     '10B981'],
    };
    const [cls, color] = map[status] || ['', '8E9AAF'];
    return `<span class="status-badge ${cls}"><span class="dot" style="background:#${color}"></span>${esc(status)}</span>`;
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function renderDashboard(data) {
    const tickets  = data.tickets          || [];
    const completed = data.completedTickets || [];
    const all      = [...tickets, ...completed];

    const pending    = all.filter(t => t.status === 'Pendente');
    const assigned   = all.filter(t => t.status === 'Atribuído');
    const inProgress = all.filter(t => t.status === 'Em andamento');
    const done       = all.filter(t => t.status === 'Concluído');

    const doneWithTime = done.filter(t => t.duracaoMinutos > 0);
    const avgMins = doneWithTime.length
      ? Math.round(doneWithTime.reduce((s, t) => s + t.duracaoMinutos, 0) / doneWithTime.length)
      : null;
    const avgLabel = avgMins !== null ? fmtDuration(avgMins) : '—';
    const conclusionRate = all.length > 0 ? Math.round((done.length / all.length) * 100) : 0;
    const total = all.length || 1;

    const segments = [
      { label:'Pendente',     count:pending.length,    color:'F59E0B' },
      { label:'Atribuído',    count:assigned.length,   color:'8B5CF6' },
      { label:'Em andamento', count:inProgress.length, color:'3B82F6' },
      { label:'Concluído',    count:done.length,        color:'10B981' },
    ].filter(s => s.count > 0);

    const now = new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });

    document.getElementById('root').innerHTML = `
      <!-- Header -->
      <div class="dash-header">
        <div class="dash-brand">
          <div>
            <div class="dash-brand-name">Build<span>.Connect</span> · Dashboard TI</div>
            <div class="dash-subtitle">Última atualização: ${now}</div>
          </div>
        </div>
        <div class="dash-status">
          <div class="dash-clock">
            <strong id="clock-value">--:--:--</strong>
            <span>Horário atual</span>
          </div>
          <div class="dash-refresh-info" id="refresh-status">
            <i data-lucide="clock-4"></i>
            <span>Atualiza a cada 5 min</span>
          </div>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid">
        <div class="kpi-card kpi-total">
          <div class="kpi-icon"><i data-lucide="inbox"></i></div>
          <div class="kpi-body">
            <span class="kpi-value">${all.length}</span>
            <span class="kpi-label">Total de chamados</span>
          </div>
        </div>
        <div class="kpi-card kpi-pending">
          <div class="kpi-icon"><i data-lucide="clock"></i></div>
          <div class="kpi-body">
            <span class="kpi-value">${pending.length}</span>
            <span class="kpi-label">Pendentes</span>
            <span class="kpi-pct">${Math.round(pending.length/total*100)}% do total</span>
          </div>
        </div>
        <div class="kpi-card kpi-assigned">
          <div class="kpi-icon"><i data-lucide="user-check"></i></div>
          <div class="kpi-body">
            <span class="kpi-value">${assigned.length}</span>
            <span class="kpi-label">Atribuídos</span>
            <span class="kpi-pct">${Math.round(assigned.length/total*100)}% do total</span>
          </div>
        </div>
        <div class="kpi-card kpi-progress">
          <div class="kpi-icon"><i data-lucide="loader-circle"></i></div>
          <div class="kpi-body">
            <span class="kpi-value">${inProgress.length}</span>
            <span class="kpi-label">Em andamento</span>
            <span class="kpi-pct">${Math.round(inProgress.length/total*100)}% do total</span>
          </div>
        </div>
        <div class="kpi-card kpi-done">
          <div class="kpi-icon"><i data-lucide="circle-check"></i></div>
          <div class="kpi-body">
            <span class="kpi-value">${done.length}</span>
            <span class="kpi-label">Concluídos</span>
            <span class="kpi-pct">${Math.round(done.length/total*100)}% do total</span>
          </div>
        </div>
      </div>

      <!-- Metrics -->
      <div class="metrics-row">
        <div class="metric-card">
          <i data-lucide="timer"></i>
          <div><span class="metric-value">${avgLabel}</span><span class="metric-label">Tempo médio de resolução</span></div>
        </div>
        <div class="metric-card">
          <i data-lucide="percent"></i>
          <div><span class="metric-value">${conclusionRate}%</span><span class="metric-label">Taxa de conclusão</span></div>
        </div>
        <div class="metric-card">
          <i data-lucide="ticket"></i>
          <div><span class="metric-value">${tickets.length}</span><span class="metric-label">Chamados em aberto</span></div>
        </div>
        <div class="metric-card">
          <i data-lucide="users"></i>
          <div><span class="metric-value">${getTopAssignee(done)}</span><span class="metric-label">Maior resolvedor</span></div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts-row">
        <div class="chart-card">
          <div class="chart-head"><i data-lucide="tag"></i><span>Por Categoria</span></div>
          ${colorBars(countBy(all, 'categoria'), COLORS_CAT)}
        </div>
        <div class="chart-card">
          <div class="chart-head"><i data-lucide="building-2"></i><span>Por Unidade</span></div>
          ${colorBars(countBy(all, 'unidade'), COLORS_UNIT)}
        </div>
        <div class="chart-card">
          <div class="chart-head"><i data-lucide="user"></i><span>Concluídos por Responsável</span></div>
          ${colorBars(countBy(done, 'atribuidoParaNome'), COLORS_USER)}
        </div>
        <div class="dist-card">
          <div class="chart-head"><i data-lucide="pie-chart"></i><span>Distribuição</span></div>
          <div class="dist-bar">
            ${segments.map(s => `<div class="dist-seg" style="width:${Math.round(s.count/total*100)}%;background:#${s.color}" title="${esc(s.label)}: ${s.count}"></div>`).join('')}
          </div>
          <div class="dist-legend">
            ${segments.map(s => `
              <div class="dist-legend-item">
                <span class="dot" style="background:#${s.color}"></span>
                <span>${esc(s.label)}</span>
                <strong>${s.count}</strong>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-section">
        <div class="table-head">
          <div class="table-title"><i data-lucide="table-2"></i><span>Todos os Chamados</span></div>
          <span class="table-count">${all.length} registros</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Solicitante</th>
                <th>Setor</th>
                <th>Unidade</th>
                <th>Categoria</th>
                <th>Responsável</th>
                <th>Aberto em</th>
                <th>Duração</th>
              </tr>
            </thead>
            <tbody>
              ${all.map(t => `
                <tr>
                  <td class="td-id">${esc(t.id || '—')}</td>
                  <td>${statusBadge(t.status || '—')}</td>
                  <td>${esc(t.solicitanteNome || '—')}</td>
                  <td>${esc(t.solicitanteSetor || '—')}</td>
                  <td>${esc(t.unidade || '—')}</td>
                  <td>${esc(t.categoria || '—')}</td>
                  <td>${esc(t.atribuidoParaNome || '—')}</td>
                  <td>${fmtDate(t.timestamp)}</td>
                  <td>${fmtDuration(t.duracaoMinutos) || '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    updateClock();
    if (window.lucide) lucide.createIcons();
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML = `
      <div class="dash-error">
        <i data-lucide="circle-alert"></i>
        <span>${esc(msg)}</span>
      </div>
    `;
    if (window.lucide) lucide.createIcons();
  }

  // ── Init ───────────────────────────────────────────────────────────────
  fetchData();
</script>
</body>
</html>
